# MB-Studio continuous integration.
#
# Runs for every pull request (and on demand). The Windows job builds the
# dependencies with vcpkg (MinGW-w64 triplet, binary cached), builds
# MB-System, MB-Studio and all tests natively on Windows, runs the complete
# test suite, creates the Inno Setup installer, installs it silently and
# smoke-tests the installed application. The Linux job guards the upstream
# platform. release.yml reuses this workflow to build release installers.
name: Build

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Version to build (defaults to the VERSION file)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with "builtin-baseline" in vcpkg.json.
  VCPKG_COMMIT: e456309491fd875487bf02b8a0dca76c1b1b00cc
  VCPKG_TRIPLET: x64-mingw-mbstudio

jobs:
  windows:
    name: Windows x64 (MinGW-w64, vcpkg, Qt 6)
    runs-on: windows-2022
    timeout-minutes: 350
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_ROOT: D:\vcpkg
      VCPKG_BINARY_CACHE: D:\vcpkg-cache
      VCPKG_BINARY_SOURCES: clear;files,D:\vcpkg-cache,readwrite
      VCPKG_DISABLE_METRICS: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          $version = "${{ inputs.version }}"
          if (-not $version) { $version = (Get-Content VERSION -TotalCount 1).Trim() }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building MB-Studio $version"

      - name: Install the MinGW-w64 toolchain (MSYS2)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-ninja

      - name: Put the toolchain on PATH
        run: |
          $mingw = "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin"
          $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$mingw\gcc.exe" --version
          $gccVersion = (& "$mingw\gcc.exe" -dumpfullversion).Trim()
          "GCC_VERSION=$gccVersion" >> $env:GITHUB_ENV

      - name: Set up Python (test driver)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          "ISCC=$($iscc.FullName)" >> $env:GITHUB_ENV

      # Restore and save explicitly: the cache must also be saved when a later
      # step fails, so that dependencies built so far are not rebuilt.
      - name: Restore the vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-gcc${{ env.GCC_VERSION }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_TRIPLET }}-gcc${{ env.GCC_VERSION }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}-
            vcpkg-${{ env.VCPKG_TRIPLET }}-gcc${{ env.GCC_VERSION }}-${{ env.VCPKG_COMMIT }}-
            vcpkg-${{ env.VCPKG_TRIPLET }}-gcc${{ env.GCC_VERSION }}-

      - name: Bootstrap vcpkg
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_BINARY_CACHE | Out-Null
          git clone --quiet https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout --quiet $env:VCPKG_COMMIT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure (builds the vcpkg dependencies on a cache miss)
        id: configure
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_MAKE_PROGRAM="$((Get-Command ninja).Source)" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TRIPLET" `
            -DVCPKG_HOST_TRIPLET="$env:VCPKG_TRIPLET" `
            -DVCPKG_INSTALL_OPTIONS="--x-buildtrees-root=D:/b;--clean-after-build" `
            -DMBSTUDIO_VERSION="${{ steps.version.outputs.version }}" `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage"

      - name: Save the vcpkg binary cache
        if: always() && steps.configure.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-gcc${{ env.GCC_VERSION }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test (native Windows functional and platform tests)
        run: ctest --test-dir build --output-on-failure --timeout 900 --parallel 2

      - name: Install into the staging directory
        run: cmake --install build

      - name: Create the installer
        run: |
          & $env:ISCC /Q `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DStageDir=${{ github.workspace }}\stage" `
            "/DSourceDir=${{ github.workspace }}" `
            "/DOutputDir=${{ github.workspace }}\dist" `
            packaging\windows\mbstudio.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist

      - name: Smoke test the installed application
        run: |
          $setup = Get-ChildItem dist\MB-Studio-*-setup.exe | Select-Object -First 1
          $target = "$env:RUNNER_TEMP\MB-Studio test install"
          # Start-Process does not quote arguments: quote the directory (it has spaces)
          $p = Start-Process $setup.FullName -Wait -PassThru -ArgumentList `
                 '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$target`"", `
                 "/LOG=`"$env:RUNNER_TEMP\setup.log`""
          if ($p.ExitCode -ne 0) { throw "setup failed with exit code $($p.ExitCode)" }
          if (-not (Test-Path "$target\bin\mbstudio.exe")) {
            Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 40
            throw "mbstudio.exe was not installed into $target\bin"
          }
          # A clean environment: only what the installer provides.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $bin = "$target\bin"
          $data = "${{ github.workspace }}\test\utilities\testdata\mb21\TN136HS.309.snipped.mb21"
          # (PowerShell waits for a GUI-subsystem program only when its output is piped)
          & "$bin\mbstudio.exe" --version | Write-Host
          $plugins = & "$bin\mbstudio.exe" --list-plugins | Out-String
          Write-Host $plugins
          if ($plugins -notmatch 'mbsystem\s+active') { throw "mbsystem plugin not active" }
          if ($plugins -notmatch 'qmlui\s+active') { throw "qmlui plugin not active" }
          if ($plugins -notmatch 'project\s+active') { throw "project plugin not active" }
          $info = & "$bin\mbinfo.exe" "-I$data" | Out-String
          if ($info -notmatch 'MBIO Data Format ID:\s+21') { throw "mbinfo failed: $info" }
          $json = & "$bin\mbstudio.exe" --command swath.inspect "path=$data" | ConvertFrom-Json
          if (-not $json.ok -or $json.records -ne 2) { throw "swath.inspect failed" }
          # A survey project from the command line: import and gridding as background jobs
          $proj = "$env:RUNNER_TEMP\smoke project\survey"
          $json = & "$bin\mbstudio.exe" --command project.create "dir=$proj" name=smoke | ConvertFrom-Json
          if (-not $json.ok) { throw "project.create failed" }
          New-Item -ItemType Directory -Force "$proj\raw" | Out-Null
          Copy-Item $data "$proj\raw\"
          $out = & "$bin\mbstudio.exe" --command project.add "project=$proj" "path=$proj\raw" | Out-String
          Write-Host $out
          $json = $out | ConvertFrom-Json
          if (-not $json.ok -or $json.added -ne 1 -or $json.inspected -ne 1) { throw "project.add failed" }
          $out = & "$bin\mbstudio.exe" --command project.grid "project=$proj" spacing=20 name=bathy | Out-String
          Write-Host $out
          $json = $out | ConvertFrom-Json
          if (-not $json.ok -or $json.state -ne "completed") { throw "project.grid failed" }
          if (-not (Test-Path "$proj\products\grids\bathy.grd")) { throw "the project grid was not written" }
          # A GMT figure of the grid in its own GMT session. GMT finishes every
          # figure with psconvert, which needs Ghostscript: without it (as on
          # this runner) the figure is refused with a clear message.
          $check = & "$bin\mbstudio.exe" --command figure.check | Out-String
          Write-Host $check
          $check = $check | ConvertFrom-Json
          if (-not $check.gmt) { throw "GMT was not found by the installed application" }
          $out = & "$bin\mbstudio.exe" --command project.figure "project=$proj" name=map formats=ps contours=10 title=Smoke | Out-String
          Write-Host $out
          $json = $out | ConvertFrom-Json
          if ($check.ghostscript) {
            if (-not $json.ok -or $json.state -ne "completed") {
              Get-ChildItem "$proj\jobs" -Recurse -Filter job.log | Select-Object -Last 1 | Get-Content | Write-Host
              throw "project.figure failed"
            }
            if (-not (Test-Path "$proj\products\figures\map.ps")) { throw "the GMT figure was not written" }
          } elseif ($json.ok -or $json.message -notmatch 'Ghostscript') {
            throw "project.figure without Ghostscript must be refused with a message naming Ghostscript"
          }
          # a job of the history runs again as a new attempt
          $out = & "$bin\mbstudio.exe" --command project.retry "project=$proj" sequence=2 | Out-String
          Write-Host $out
          $json = $out | ConvertFrom-Json
          if (-not $json.ok) { throw "project.retry failed" }
          # Help pages: Markdown for the application, HTML for the browser
          $help = & "$bin\mbstudio.exe" --help-program mbgrid --lang en | Out-String
          if ($help -notmatch '## Synopsis') { throw "mbstudio --help-program failed: $help" }
          foreach ($lang in 'en', 'ja', 'zh_CN') {
            foreach ($page in "$target\share\mbstudio\help\$lang\mbgrid.md", "$target\share\doc\mbstudio\help\$lang\mbgrid.html") {
              if (-not (Test-Path $page)) { throw "help page not installed: $page" }
            }
          }
          & "$bin\mblevitus.exe" -R-130/30 "-O$env:RUNNER_TEMP\velocity.svp"
          if ($LASTEXITCODE -ne 0) { throw "mblevitus failed" }
          & "$bin\gmt.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "gmt failed" }
          # GMT finds the MB-System supplement (mbswath, mbcontour, ...) in bin\gmt_plugins
          $usage = & "$bin\gmt.exe" mbswath 2>&1 | Out-String
          if ($usage -notmatch 'mbswath \[mbsystem\]') { throw "MB-System GMT supplement not found: $usage" }
          # The user interface starts on the runner's real desktop (not
          # offscreen, so the Windows platform plugin and the window frame
          # are used): its window appears, it answers, it is idle afterwards
          # and Qt reports no failure to create the window. Both title bars.
          function Test-Gui($label, [hashtable]$envs) {
            foreach ($k in $envs.Keys) { Set-Item "env:$k" $envs[$k] }
            $guiLog = "$env:RUNNER_TEMP\gui-$label.log"
            $gui = Start-Process "$bin\mbstudio.exe" -PassThru -RedirectStandardError $guiLog
            $shown = $false
            for ($i = 0; $i -lt 30 -and -not $shown; $i++) {
              Start-Sleep -Seconds 1
              $gui.Refresh()
              if ($gui.HasExited) { break }
              $shown = $gui.MainWindowHandle -ne 0
            }
            $exited = $gui.HasExited
            $idleCpu = 0
            if ($shown) {
              Start-Sleep -Seconds 3
              $gui.Refresh()
              $before = $gui.TotalProcessorTime.TotalSeconds
              Start-Sleep -Seconds 10
              $gui.Refresh()
              $idleCpu = $gui.TotalProcessorTime.TotalSeconds - $before
            }
            $responding = -not $gui.HasExited -and $gui.Responding
            if (-not $gui.HasExited) { Stop-Process -Id $gui.Id -Force }
            foreach ($k in $envs.Keys) { Remove-Item "env:$k" -ErrorAction SilentlyContinue }
            $stderr = Get-Content $guiLog -Raw -ErrorAction SilentlyContinue
            Write-Host "GUI ($label): window=$shown responding=$responding idle CPU=$([math]::Round($idleCpu, 2)) s in 10 s"
            if ($exited) { Write-Host $stderr; throw "the user interface ($label) exited early with code $($gui.ExitCode)" }
            if ($stderr -match 'Failed to create platform window') { Write-Host $stderr; throw "the main window ($label) could not be created" }
            if (-not $shown) { Write-Host $stderr; throw "the main window ($label) did not appear within 30 s" }
            if (-not $responding) { throw "the user interface ($label) does not respond" }
            if ($idleCpu -gt 3) { throw "the user interface ($label) is busy while idle ($idleCpu s CPU in 10 s)" }
          }
          $env:QT_FORCE_STDERR_LOGGING = "1"
          Test-Gui "system-title-bar" @{}
          Test-Gui "custom-title-bar" @{ MBSTUDIO_CUSTOM_TITLEBAR = "1" }
          # and offscreen (no window system)
          $env:QT_QPA_PLATFORM = "offscreen"
          $guiLog = "$env:RUNNER_TEMP\gui-stderr.log"
          $gui = Start-Process "$bin\mbstudio.exe" -PassThru -RedirectStandardError $guiLog
          Start-Sleep -Seconds 10
          if ($gui.HasExited) {
            Get-Content $guiLog -ErrorAction SilentlyContinue | Write-Host
            throw "the user interface exited early with code $($gui.ExitCode)"
          }
          Stop-Process -Id $gui.Id
          Write-Host "Installed application OK"
          # (the runner exits with $LASTEXITCODE, set by the gmt usage call above)
          exit 0

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: MB-Studio-windows-x64
          path: dist/*.exe
          if-no-files-found: error

      - name: Collect logs on failure
        if: failure()
        run: |
          # Qt run-time layout (helps diagnosing plugin loading failures)
          Get-ChildItem build\vcpkg_installed\${{ env.VCPKG_TRIPLET }} -Directory -Recurse -Depth 3 -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in 'platforms', 'qml', 'plugins' } | ForEach-Object {
              Write-Host "== $($_.FullName)"; Get-ChildItem $_.FullName | Select-Object -First 30 | ForEach-Object { Write-Host "   $($_.Name)" } }
          $logs = New-Item -ItemType Directory -Force "${{ github.workspace }}\ci-logs"
          Copy-Item build\vcpkg-manifest-install.log $logs -ErrorAction SilentlyContinue
          Copy-Item build\Testing\Temporary\*.log $logs -ErrorAction SilentlyContinue
          if (Test-Path D:\b) {
            Get-ChildItem D:\b -Recurse -Filter *.log | ForEach-Object {
              $port = $_.FullName.Substring(5).Split('\')[0]
              New-Item -ItemType Directory -Force "$logs\vcpkg\$port" | Out-Null
              Copy-Item $_.FullName "$logs\vcpkg\$port\"
            }
          }
          Copy-Item build\src\mbstudio\tests\qmlui\screenshots\*.png $logs -ErrorAction SilentlyContinue

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-windows
          path: ci-logs
          if-no-files-found: ignore

  linux:
    name: Linux (regression check)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake pkg-config \
            libgmt-dev gmt libnetcdf-dev libproj-dev libgdal-dev libfftw3-dev libtirpc-dev \
            qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates \
            qml6-module-qtquick-dialogs qml6-module-qtquick-shapes qml6-module-qtqml-workerscript \
            qml6-module-qtcore ghostscript

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DbuildGUIs=OFF -DbuildOpenCV=OFF -DbuildTRN=OFF

      - name: Save the vcpkg binary cache
        if: always() && steps.configure.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-gcc${{ env.GCC_VERSION }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 600 --parallel 4

      - name: Upload screenshots of the user interface
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-linux
          path: build/src/mbstudio/tests/qmlui/screenshots/*.png
          if-no-files-found: ignore
